services:
  clipmesh:
    build: .
    image: clipmesh:latest
    container_name: clipmesh
    restart: unless-stopped
    ports:
      - "8789:8787"
    environment:
      PORT: "8787"
      PUBLIC_PORT: "8789"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      MAX_FILE_MB: "32"
      MAX_CLIPS: "200"
      AUTH_USERNAME: "${AUTH_USERNAME:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      REMEMBER_TTL_DAYS: "${REMEMBER_TTL_DAYS:-30}"
    volumes:
      - clipmesh-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  clipmesh-data:
