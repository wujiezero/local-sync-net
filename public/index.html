<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010102" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="局域网实时剪贴板 — 文本、图片、附件在浏览器间同步" />
    <title>ClipMesh · LAN Clipboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=m7" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button id="rail-toggle" class="icon-btn rail-toggle" type="button" aria-label="打开菜单" data-toast="off">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>

        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
              <rect x="9" y="7" width="14" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7" />
              <rect x="12" y="5.5" width="8" height="3.5" rx="1.2" stroke="currentColor" stroke-width="1.5" />
              <path d="M13 14.5h8M13 18.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </span>
          <div class="brand-copy">
            <h1>ClipMesh</h1>
            <p>局域网实时网格</p>
          </div>
        </div>

        <div class="topbar-meta">
          <nav class="nav">
            <a href="/" aria-current="page">时间线</a>
            <a id="archives-link" href="#archives">归档</a>
            <a id="settings-link" href="/settings">标签配置</a>
            <a href="/admin">房间管理</a>
          </nav>
          <span id="status" class="status" data-state="connecting">
            <i></i><span>连接中</span>
          </span>
          <span id="peer-count" class="meta-chip">0 台在线</span>
          <button id="logout" class="btn btn-ghost btn-mini" type="button" hidden>退出</button>
        </div>
      </header>

      <div id="rail-scrim" class="rail-scrim" hidden></div>

      <aside id="rail" class="rail">
        <div class="rail-head">
          <h2>设置</h2>
          <button id="rail-close" class="icon-btn" type="button" aria-label="关闭菜单" data-toast="off">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <section class="panel">
          <div class="panel-head">
            <h2>房间</h2>
            <span class="hint">同一房间即同步</span>
          </div>
          <label class="field">
            <span>房间名</span>
            <input id="room" type="text" maxlength="48" autocomplete="off" spellcheck="false" />
          </label>
          <label class="field">
            <span>设备名</span>
            <input id="device-name" type="text" maxlength="40" autocomplete="off" />
          </label>
          <button id="join" class="btn btn-primary" type="button">加入房间</button>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>在线设备</h2>
            <span id="peer-hint" class="hint">等待加入</span>
          </div>
          <ul id="peers" class="peer-list"></ul>
        </section>

        <section class="panel rail-nav-panel">
          <div class="panel-head">
            <h2>导航</h2>
          </div>
          <nav class="nav">
            <a href="/" aria-current="page">时间线</a>
            <a id="rail-archives-link" href="#archives">归档</a>
            <a id="rail-settings-link" href="/settings">标签配置</a>
            <a href="/admin">房间管理</a>
          </nav>
          <button id="rail-logout" class="btn btn-ghost" type="button" hidden>退出登录</button>
        </section>

        <section class="panel panel-quiet">
          <p class="howto">
            文本和附件在同一个发送框。归档会收起当前时间线，历史仍可查看；删除归档需验证码。
          </p>
          <p id="lan-url" class="howto mono" hidden></p>
        </section>
      </aside>

      <main class="stage">
        <section class="timeline-wrap">
          <div class="panel-head timeline-head">
            <h2>同步时间线</h2>
            <div class="timeline-tools">
              <span id="filter-count" class="hint"></span>
              <button id="filter-toggle" class="btn btn-ghost btn-mini" type="button" data-toast="off">筛选</button>
              <button id="reset-filters" class="btn btn-ghost btn-mini" type="button">重置</button>
              <button id="archive-room" class="btn btn-ghost btn-mini" type="button">归档</button>
            </div>
          </div>
          <div id="filters" class="filters">
            <div id="tag-filters" class="chip-row"></div>
            <div class="time-filters">
              <label class="field time-field">
                <span>从</span>
                <input id="from-time" type="datetime-local" />
              </label>
              <label class="field time-field">
                <span>到</span>
                <input id="to-time" type="datetime-local" />
              </label>
            </div>
          </div>
          <div id="timeline" class="timeline"></div>
        </section>

        <section class="composer">
          <div id="reply-bar" class="reply-bar" hidden>
            <span class="reply-bar-bar" aria-hidden="true"></span>
            <div class="reply-bar-copy">
              <span class="hint"><span id="compose-mode">回复</span> <b id="reply-name"></b></span>
              <p id="reply-preview" class="reply-preview"></p>
            </div>
            <button id="reply-cancel" class="icon-btn" type="button" aria-label="取消" data-toast="off">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </div>

          <div id="attach-preview" class="attach-preview" hidden></div>

          <div id="draft-tags" class="chip-row draft-tags"></div>

          <div id="composer-box" class="composer-box">
            <input id="file-input" type="file" hidden />
            <button id="pick-file" class="icon-btn composer-icon" type="button" aria-label="添加附件" data-toast="off">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
            <textarea
              id="draft"
              rows="1"
              placeholder="输入消息…"
              maxlength="200000"
            ></textarea>
            <button id="copy-os" class="icon-btn composer-icon" type="button" aria-label="读系统剪贴板" data-toast="off">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="8" y="4" width="12" height="16" rx="2" stroke="currentColor" stroke-width="1.6" />
                <path d="M16 4H6a2 2 0 0 0-2 2v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </button>
            <button id="send" class="icon-btn composer-send" type="button" aria-label="发送" data-toast="off">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="currentColor" />
              </svg>
            </button>
          </div>

          <div class="composer-meta">
            <span id="format-hint" class="hint">文本</span>
            <span id="limit-hint" class="hint">附件上限 32 MB</span>
            <span id="draft-count" class="hint mono">0</span>
          </div>
        </section>
      </main>
    </div>

    <div id="archive-drawer" class="drawer" hidden>
      <div class="drawer-panel">
        <div class="panel-head">
          <h2>归档</h2>
          <div class="composer-actions">
            <button id="archive-import" class="btn btn-ghost btn-mini" type="button">导入 zip</button>
            <button id="archive-close" class="btn btn-ghost btn-mini" type="button">关闭</button>
          </div>
        </div>
        <input id="archive-import-file" type="file" accept=".zip,application/zip" hidden />
        <div id="archive-list" class="archive-list"></div>
        <div id="archive-view" class="archive-view" hidden></div>
      </div>
    </div>

    <div id="reply-modal" class="modal" hidden>
      <div class="modal-card reply-modal-card">
        <div class="panel-head">
          <h2>回复 <span id="inline-reply-name"></span></h2>
          <button id="inline-reply-cancel" class="btn btn-ghost btn-mini" type="button">关闭</button>
        </div>
        <p id="inline-reply-preview" class="reply-preview"></p>
        <textarea id="inline-reply-draft" maxlength="200000" placeholder="输入回复… Ctrl/⌘ + Enter 发送"></textarea>
        <div class="composer-actions" style="margin-top:12px">
          <button id="inline-reply-send" class="btn btn-primary" type="button">发送回复</button>
        </div>
      </div>
    </div>

    <div id="confirm-modal" class="modal" hidden>
      <div class="modal-card">
        <h2 id="dialog-title">确认</h2>
        <p id="dialog-body" class="howto"></p>
        <input id="dialog-input" type="text" autocomplete="off" hidden />
        <div class="composer-actions" style="margin-top:12px">
          <button id="dialog-cancel" class="btn btn-ghost" type="button">取消</button>
          <button id="dialog-ok" class="btn btn-primary" type="button">确定</button>
        </div>
      </div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button id="lightbox-close" class="btn btn-ghost lightbox-close" type="button">关闭</button>
      <img id="lightbox-image" alt="" />
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="/app.js?v=m7" type="module"></script>
  </body>
</html>
