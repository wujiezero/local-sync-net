<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010102" />
    <meta name="color-scheme" content="dark" />
    <title>ClipMesh · 登录</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="panel login-card">
        <div class="brand login-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
              <rect x="9" y="7" width="14" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7" />
              <rect x="12" y="5.5" width="8" height="3.5" rx="1.2" stroke="currentColor" stroke-width="1.5" />
              <path d="M13 14.5h8M13 18.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </span>
          <div class="brand-copy">
            <h1>ClipMesh</h1>
            <p>使用账号登录</p>
          </div>
        </div>
        <form id="login-form">
          <label class="field">
            <span>用户名</span>
            <input id="username" type="text" autocomplete="username" required />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="howto login-error" hidden></p>
          <button class="btn btn-primary" type="submit">进入</button>
        </form>
      </section>
    </main>
    <script src="/login.js" type="module"></script>
  </body>
</html>
