<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010102" />
    <meta name="color-scheme" content="dark" />
    <title>ClipMesh · 房间管理</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=m3" />
  </head>
  <body>
    <div class="app settings-app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
              <rect x="9" y="7" width="14" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7" />
              <rect x="12" y="5.5" width="8" height="3.5" rx="1.2" stroke="currentColor" stroke-width="1.5" />
              <path d="M13 14.5h8M13 18.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </span>
          <div class="brand-copy">
            <h1>ClipMesh</h1>
            <p>房间管理</p>
          </div>
        </div>
        <div class="topbar-meta">
          <nav class="nav">
            <a href="/">时间线</a>
            <a href="/#archives">归档</a>
            <a href="/settings">标签配置</a>
            <a href="/admin" aria-current="page">房间管理</a>
          </nav>
          <button id="logout" class="btn btn-ghost btn-mini" type="button" hidden>退出</button>
        </div>
      </header>

      <aside class="rail">
        <section class="panel">
          <div class="panel-head">
            <h2>总览</h2>
            <span class="hint">磁盘上仍保留的房间</span>
          </div>
          <ul class="stat-list">
            <li><span>全部房间</span><b id="stat-total" class="mono">0</b></li>
            <li><span>有人在线</span><b id="stat-live" class="mono">0</b></li>
            <li><span>孤儿房间</span><b id="stat-orphan" class="mono">0</b></li>
          </ul>
        </section>
        <section class="panel panel-quiet">
          <p class="howto">
            孤儿房间：当前没人打开，但时间线或归档还在。人走数据不会丢，可从这里进入或继续归档。
          </p>
          <button id="refresh" class="btn btn-ghost" type="button">刷新</button>
        </section>
      </aside>

      <main class="stage settings-stage">
        <section class="panel">
          <div class="panel-head">
            <h2>全部房间</h2>
            <div class="chip-row">
              <button id="filter-all" class="chip active" type="button">全部</button>
              <button id="filter-live" class="chip" type="button">在线</button>
              <button id="filter-orphan" class="chip" type="button">孤儿</button>
            </div>
          </div>
          <div id="room-list" class="catalog-list"></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script src="/admin.js?v=toast2" type="module"></script>
  </body>
</html>
