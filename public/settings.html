<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#010102" />
    <meta name="color-scheme" content="dark" />
    <title>ClipMesh · 标签配置</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=m7" />
  </head>
  <body>
    <div class="app settings-app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
              <rect x="9" y="7" width="14" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7" />
              <rect x="12" y="5.5" width="8" height="3.5" rx="1.2" stroke="currentColor" stroke-width="1.5" />
              <path d="M13 14.5h8M13 18.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </span>
          <div class="brand-copy">
            <h1>ClipMesh</h1>
            <p>标签配置</p>
          </div>
        </div>
        <div class="topbar-meta">
          <nav class="nav">
            <a href="/">时间线</a>
            <a href="/#archives">归档</a>
            <a href="/settings" aria-current="page">标签配置</a>
            <a href="/admin">房间管理</a>
          </nav>
          <span id="status" class="status" data-state="connecting"><i></i><span>连接中</span></span>
          <button id="logout" class="btn btn-ghost btn-mini" type="button" hidden>退出</button>
        </div>
      </header>

      <aside class="rail">
        <section class="panel">
          <div class="panel-head">
            <h2>房间</h2>
            <span class="hint">标签按房间隔离</span>
          </div>
          <label class="field">
            <span>房间名</span>
            <input id="room" type="text" maxlength="48" autocomplete="off" spellcheck="false" />
          </label>
          <label class="field">
            <span>设备名</span>
            <input id="device-name" type="text" maxlength="40" autocomplete="off" />
          </label>
          <button id="join" class="btn btn-primary" type="button">连接房间</button>
        </section>
        <section class="panel panel-quiet">
          <p class="howto">
            在这里增删改房间标签。重命名或删除会同步到该房间所有消息，时间线只负责给消息选用标签。
          </p>
        </section>
      </aside>

      <main class="stage settings-stage">
        <section class="panel">
          <div class="panel-head">
            <h2>新增标签</h2>
            <span id="tag-count" class="hint">0 / 40</span>
          </div>
          <div class="custom-tag">
            <input id="new-tag" type="text" maxlength="16" placeholder="例如：发布、排查、凭证" autocomplete="off" />
            <button id="add-tag" class="btn btn-primary btn-mini" type="button">添加</button>
          </div>
        </section>

        <section class="panel catalog-panel">
          <div class="panel-head">
            <h2>房间标签</h2>
            <span class="hint">最多 40 个，消息最多挂 6 个</span>
          </div>
          <div id="catalog" class="catalog-list"></div>
        </section>
      </main>
    </div>
    <div id="confirm-modal" class="modal" hidden>
      <div class="modal-card">
        <h2 id="dialog-title">确认</h2>
        <p id="dialog-body" class="howto"></p>
        <input id="dialog-input" type="text" autocomplete="off" hidden />
        <div class="composer-actions" style="margin-top:12px">
          <button id="dialog-cancel" class="btn btn-ghost" type="button">取消</button>
          <button id="dialog-ok" class="btn btn-primary" type="button">确定</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script src="/settings.js?v=m7" type="module"></script>
  </body>
</html>
